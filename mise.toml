# Every tool the repository's commands use, pinned exactly (releases at least 7 days old). `make tools` installs
# them; the Makefile puts them first on PATH. aqua-backed tools are checksum-verified by mise; Renovate updates them.
[tools]
opentofu = "1.13.9"
talosctl = "1.14.6"
kubectl = "1.37.2"
helm = "4.3.2"
flux2 = "2.10.0"
sops = "3.13.3"
kubeconform = "0.8.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
restic = "0.19.1"
shellcheck = "0.11.0"
yamllint = "1.38.0"
age = "1.3.2"
jq = "1.8.2"
