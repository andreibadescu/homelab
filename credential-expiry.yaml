# Expiry dates of the credentials that expire. Checked monthly by
# .github/workflows/credential-expiry.yaml, which opens an issue 45 days before.
# kubeconfig, talosconfig: renew with `make creds` (it updates these two lines).
# cloudflare-api-token: roll it in Cloudflare (My Profile -> API Tokens -> homelab-opentofu -> Roll),
#   store it as cloudflare_api_token in tofu/secrets.sops.yaml and update the date here.
kubeconfig: 2027-11-19
talosconfig: 2027-11-18
cloudflare-api-token: 2027-11-20
# ente-backups-r2-key: roll it in Cloudflare (R2 -> Manage API tokens -> ente-backups), update the
#   AWS_* values in kubernetes/apps/ente/backup.sops.yaml and the date here.
ente-backups-r2-key: 2027-11-20
