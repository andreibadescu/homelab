# Monthly reminder before the homelab admin credentials expire. GitHub can't reach the
# cluster, so it reads the dates `make creds` records in credential-expiry.yaml and opens
# an issue (which notifies you) when one is less than 45 days away.
name: credential-expiry
on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check expiry dates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          soon=""
          while IFS=': ' read -r name day; do
            [ -z "$day" ] && continue
            left=$(( ( $(date -u -d "$day" +%s) - $(date -u +%s) ) / 86400 ))
            echo "$name expires $day ($left days)"
            if [ "$left" -lt 45 ]; then
              soon+="- $name expires on $day ($left days left)"$'\n'
            fi
          done < <(grep -E '^[a-z]+: [0-9-]+$' credential-expiry.yaml)
          [ -z "$soon" ] && exit 0
          title="Homelab admin credentials expire soon"
          if gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
            exit 0
          fi
          body="${soon}
          Renew on the home network with make creds (it also updates credential-expiry.yaml; commit that).
          Talos renews the cluster's internal certificates itself; only these admin credentials expire."
          gh issue create --title "$title" --body "$body"
