apiVersion: v1
kind: Service
metadata:
  name: ente-postgres
  namespace: ente
spec:
  selector: {app: ente-postgres}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ente-postgres
  namespace: ente
spec:
  serviceName: ente-postgres
  replicas: 1
  selector:
    matchLabels: {app: ente-postgres}
  template:
    metadata:
      labels: {app: ente-postgres}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: docker.io/library/postgres:15.20-alpine
          env:
            - {name: POSTGRES_USER, value: pguser}
            - {name: POSTGRES_DB, value: ente_db}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: ente-secrets, key: POSTGRES_PASSWORD}}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, pguser, -d, ente_db]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, pguser, -d, ente_db]}
            periodSeconds: 60
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
