apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets.sops.yaml
  - postgres.yaml
  - s3.yaml
  - museum.yaml
  - web.yaml
  - ingress.yaml
  - s3-cluster-path.yaml
  - networkpolicies.yaml
  - storage-limit.yaml
configMapGenerator:
  # Museum reads this at startup; the generated name changes with the content, so a config change
  # rolls museum automatically.
  - name: ente-museum
    namespace: ente
    files:
      - museum.yaml=config/museum.yaml
