# Cloudflare Tunnel "homelab" (outbound only, no open ports). Only the public dashboard, its API calls
# and Grafana's static files are routed; every other path returns 404 at Cloudflare's edge.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: showcase
data:
  config.yaml: |
    tunnel: 7f2e12dd-754d-4c6a-a378-02e7fc87bbe0
    credentials-file: /etc/cloudflared/credentials/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: homelab.andreibadescu.com
        path: ^/$
        service: http://showcase-redirect.showcase.svc:8080
      - hostname: homelab.andreibadescu.com
        path: ^/public-dashboards/1dc30d40eb9e56906a89c0dfa85afe13$
        service: http://grafana-public.showcase.svc:80
      - hostname: homelab.andreibadescu.com
        path: ^/api/public/dashboards/1dc30d40eb9e56906a89c0dfa85afe13(/.*)?$
        service: http://grafana-public.showcase.svc:80
      - hostname: homelab.andreibadescu.com
        path: ^/public/(build|fonts|img)/
        service: http://grafana-public.showcase.svc:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: showcase
spec:
  replicas: 1
  selector:
    matchLabels: {app: cloudflared}
  template:
    metadata:
      labels: {app: cloudflared}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.11.1
          args: [tunnel, --config, /etc/cloudflared/config.yaml, run]
          readinessProbe:
            httpGet: {path: /ready, port: 2000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: 2000}
            periodSeconds: 60
            failureThreshold: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/cloudflared/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: credentials, mountPath: /etc/cloudflared/credentials, readOnly: true}
      volumes:
        - name: config
          configMap: {name: cloudflared}
        - name: credentials
          secret: {secretName: cloudflared-credentials}
