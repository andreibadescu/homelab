# Projects whose manifests live in their own repositories: the fence for each (namespaces, quotas,
# network rules, permissions) and the Flux objects that apply its repository (docs/new-project.md).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./kubernetes/tenants
  prune: true
  # Don't wait for the projects' own objects to become healthy: one project's broken Git source must not
  # block the fences of the others. Project failures alert on their own (flux-alerts.yaml).
  wait: false
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
