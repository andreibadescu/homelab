# Sizes from the EnjoyDevOps answers (2026-11-20). LimitRanges give defaults to containers without
# their own requests or limits.
apiVersion: v1
kind: ResourceQuota
metadata: {name: enjoydevops, namespace: enjoydevops}
spec:
  hard: {requests.cpu: "1", requests.memory: 2Gi, limits.memory: 4Gi, requests.storage: 20Gi, pods: "15"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: enjoydevops}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 20m, memory: 64Mi}
      default: {memory: 256Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: edo-lab, namespace: edo-lab}
spec:
  hard: {requests.cpu: 200m, requests.memory: 256Mi, limits.memory: 512Mi, pods: "3"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: edo-lab}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 20m, memory: 32Mi}
      default: {memory: 256Mi}
---
# Learner VMs: memory and CPU requests only (no limits, no default CPU limit: it would throttle VMs).
apiVersion: v1
kind: ResourceQuota
metadata: {name: edo-labs, namespace: edo-labs}
spec:
  hard: {requests.memory: 16Gi, requests.cpu: "4", pods: "12", secrets: "20"}
---
# Builds: low priority (PriorityClass builds) and capped, so they never starve the live apps.
apiVersion: v1
kind: ResourceQuota
metadata: {name: enjoydevops-builds, namespace: enjoydevops-builds}
spec:
  hard: {limits.cpu: "4", limits.memory: 8Gi, requests.storage: 30Gi, pods: "4", requests.devices.kubevirt.io/kvm: "1"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: enjoydevops-builds}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 500m, memory: 512Mi}
      default: {cpu: "4", memory: 4Gi}
