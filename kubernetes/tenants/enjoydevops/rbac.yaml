# What Flux may create when it applies the EnjoyDevOps repository: these kinds, only in the three app
# namespaces. No namespaces, cluster-wide objects or Flux objects, so the project can't give itself
# more rights. "escalate" and "bind" let it grant its own workloads permissions inside its namespaces
# (edo-lab's Role on lab VMs).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-deployer
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete, escalate, bind]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules, servicemonitors, podmonitors]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kubevirt.io, subresources.kubevirt.io]
    resources: ["*"]
    verbs: ["*"]
  # PostgreSQL through CloudNativePG, with point-in-time recovery to R2 (Barman Cloud plugin).
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, backups, scheduledbackups, poolers, databases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: flux-enjoydevops, namespace: enjoydevops}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: flux-enjoydevops, namespace: enjoydevops}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenant-deployer}
subjects: [{kind: ServiceAccount, name: flux-enjoydevops, namespace: enjoydevops}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: flux-enjoydevops, namespace: edo-lab}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenant-deployer}
subjects: [{kind: ServiceAccount, name: flux-enjoydevops, namespace: enjoydevops}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: flux-enjoydevops, namespace: edo-labs}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenant-deployer}
subjects: [{kind: ServiceAccount, name: flux-enjoydevops, namespace: enjoydevops}]
