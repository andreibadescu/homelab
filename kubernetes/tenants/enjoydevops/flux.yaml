# Flux applies ./deploy/k8s from the EnjoyDevOps repository (read-only deploy key) as flux-enjoydevops,
# decrypting its secrets with the tenant key. Resumed 2026-11-21, once its secrets were encrypted for
# that key and its images were in the registry.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: enjoydevops, namespace: enjoydevops}
spec:
  interval: 1m
  url: ssh://git@github.com/andreibadescu/enjoydevops.git
  ref: {branch: main}
  secretRef: {name: enjoydevops-git}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: enjoydevops, namespace: enjoydevops}
spec:
  suspend: false
  interval: 10m
  timeout: 5m
  sourceRef: {kind: GitRepository, name: enjoydevops}
  path: ./deploy/k8s
  prune: true
  serviceAccountName: flux-enjoydevops
  decryption:
    provider: sops
    secretRef: {name: sops-age}
