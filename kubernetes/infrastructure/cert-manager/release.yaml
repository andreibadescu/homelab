apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
# Updates are merged by hand (renovate.json): the backup plugin of the production database depends on it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef: {kind: HelmRepository, name: jetstack}
  install:
    crds: CreateReplace
    remediation: {retries: 3}
  upgrade:
    crds: CreateReplace
    remediation: {retries: 3}
  values:
    crds:
      enabled: true
      keep: true
    resources:
      requests: {cpu: 10m, memory: 48Mi}
      limits: {memory: 256Mi}
    webhook:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    cainjector:
      resources:
        requests: {cpu: 10m, memory: 48Mi}
        limits: {memory: 256Mi}
    startupapicheck:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
