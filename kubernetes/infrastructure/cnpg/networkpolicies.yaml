# Incoming: only between the operator and the plugin, and from Prometheus; webhook calls come from the
# node (always allowed). The operator reaches database pods in project namespaces, whose own policies
# must allow namespace cnpg-system on ports 8000 and 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: cnpg-system}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: own-pods-and-prometheus, namespace: cnpg-system}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
