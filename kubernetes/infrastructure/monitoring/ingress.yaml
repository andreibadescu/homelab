# https://grafana.junco-ulmer.ts.net, on the homelab tailnet only (share the device to use it).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: tailscale
  defaultBackend: {service: {name: kube-prometheus-stack-grafana, port: {number: 80}}}
  tls: [{hosts: [grafana]}]
