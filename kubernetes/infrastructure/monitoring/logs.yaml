apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
# Loki stores logs: one process, filesystem storage on the encrypted data volume, 7 days.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: 7.7.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index: {prefix: index_, period: 24h}
      limits_config:
        retention_period: 168h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
    singleBinary:
      replicas: 1
      persistence:
        size: 10Gi
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {memory: 1Gi}
    # Single-process mode: no separate read/write/backend tiers, gateway, caches or test pods.
    read: {replicas: 0}
    write: {replicas: 0}
    backend: {replicas: 0}
    gateway: {enabled: false}
    chunksCache: {enabled: false}
    resultsCache: {enabled: false}
    lokiCanary: {enabled: false}
    test: {enabled: false}
---
# Alloy collects every pod's logs and the Kubernetes events through the API (no host access
# needed on Talos) and sends them to Loki. It is also the OpenTelemetry collector: apps send OTLP to
# alloy.monitoring.svc (gRPC 4317, HTTP 4318); traces go to Tempo, logs to Loki, metrics to
# Prometheus.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: loki
  chart:
    spec:
      chart: alloy
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    controller:
      type: deployment
      replicas: 1
    alloy:
      extraPorts:
        - {name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP}
        - {name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP}
      resources:
        requests: {cpu: 20m, memory: 96Mi}
        limits: {memory: 384Mi}
      configMap:
        content: |
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.default.receiver]
          }

          loki.source.kubernetes_events "events" {
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
          }

          // OpenTelemetry: OTLP in, batched, then traces to Tempo, logs to Loki, metrics to Prometheus.
          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              traces  = [otelcol.processor.batch.default.input]
              logs    = [otelcol.processor.batch.default.input]
              metrics = [otelcol.processor.batch.default.input]
            }
          }

          otelcol.processor.batch "default" {
            output {
              traces  = [otelcol.exporter.otlp.tempo.input]
              logs    = [otelcol.exporter.loki.default.input]
              metrics = [otelcol.exporter.prometheus.default.input]
            }
          }

          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo.monitoring.svc:4317"
              tls {
                insecure = true
              }
            }
          }

          otelcol.exporter.loki "default" {
            forward_to = [loki.write.default.receiver]
          }

          otelcol.exporter.prometheus "default" {
            forward_to = [prometheus.remote_write.default.receiver]
          }

          prometheus.remote_write "default" {
            endpoint {
              url = "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write"
            }
          }
