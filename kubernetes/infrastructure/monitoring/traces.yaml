# Tempo stores traces: one process, local storage on the data volume, 7 days. Alloy forwards
# OpenTelemetry traces to it (logs.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: tempo
      version: 1.24.4
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    tempo:
      retention: 168h
      storage:
        trace:
          backend: local
          local: {path: /var/tempo/traces}
          wal: {path: /var/tempo/wal}
      receivers:
        otlp:
          protocols:
            grpc: {endpoint: "0.0.0.0:4317"}
            http: {endpoint: "0.0.0.0:4318"}
      resources:
        requests: {cpu: 20m, memory: 128Mi}
        limits: {memory: 1Gi}
    persistence:
      enabled: true
      size: 10Gi
