# Incoming traffic to the Tailscale operator and proxies: default deny, then only WireGuard (UDP from
# anywhere, so devices can connect directly instead of through Tailscale's relays) and Ente's server
# reaching the ente-s3 proxy. Outgoing traffic stays open (Tailscale's control plane, relays, peers,
# and the apps behind each proxy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: tailscale}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: proxies-wireguard, namespace: tailscale}
spec:
  podSelector:
    matchExpressions:
      - {key: tailscale.com/parent-resource, operator: Exists}
  policyTypes: [Ingress]
  ingress:
    - from: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: UDP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ente-s3-from-museum, namespace: tailscale}
spec:
  podSelector: {matchLabels: {tailscale.com/parent-resource: ente-s3, tailscale.com/parent-resource-ns: ente}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ente}}
          podSelector: {matchLabels: {app: ente-museum}}
      ports: [{protocol: TCP, port: 443}]
